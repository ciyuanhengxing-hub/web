<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛機大戰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <div id="gameStart">
            <img src="img/start_b.png" alt="開始按鈕" id="imageButton" draggable="false">
        </div>

        <div id="gameEnter">
            <canvas id="bgCanvas"></canvas>

            <div id="hearts"></div>
            <div id="energy"></div>

            <div id="plane">
                <img src="img/plane.png" alt="飛機" draggable="false">
            </div>

            <div id="enemy"></div>
            <div id="shield"></div>
            <div id="warning"></div>
            <div id="enemyBullet"></div>
            <div id="bullet"></div>
            <div id="effect"></div>

            <div id="score"></div>

            <div id="startCover">
                <div id="startText">點擊開始遊戲</div>
                <div id="gameOverScore"></div>
            </div>

            <div id="gameMenu">
                <img src="img/sound_k.png" alt="音量" id="soundButton" draggable="false">
                <img src="img/Pause.png" alt="暫停" id="pauseButton" draggable="false">
                <img src="img/Retry.png" alt="重來" id="retryButton" draggable="false">
            </div>
        </div>
    </div>

    <audio id="bgm" src="audio/The_Rebel_Path.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
